<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register untuk mendapatkan API Key CoffeeSpot">
    <title>Register - CoffeeSpot API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-hero);
            padding: var(--space-lg);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-lg);
            text-decoration: none;
        }

        .auth-title {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--space-xs);
        }

        .auth-subtitle {
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-footer p {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            margin: 0;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: var(--font-size-lg);
        }

        .alert-container {
            margin-bottom: var(--space-md);
        }

        .password-strength {
            margin-top: var(--space-xs);
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak {
            width: 33%;
            background: var(--color-danger);
        }

        .strength-medium {
            width: 66%;
            background: var(--color-warning);
        }

        .strength-strong {
            width: 100%;
            background: var(--color-success);
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="../index.html" class="auth-logo">
                        <span>☕</span>
                        <span>CoffeeSpot</span>
                    </a>
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Register untuk mendapatkan API Key gratis</p>
                </div>

                <div class="alert-container" id="alertContainer"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="johndoe"
                            required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com"
                            required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Minimal 8 karakter" required minlength="8" autocomplete="new-password">
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                👁️
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                            placeholder="Ulangi password" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
                        Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Sudah punya akun? <a href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Redirect if already authenticated
        Auth.redirectIfAuthenticated();

        const form = document.getElementById('registerForm');
        const alertContainer = document.getElementById('alertContainer');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');

        // Password strength checker
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength === 1) strengthBar.classList.add('strength-weak');
            else if (strength === 2) strengthBar.classList.add('strength-medium');
            else if (strength === 3) strengthBar.classList.add('strength-strong');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                UI.showAlert(alertContainer, 'danger', 'Password tidak cocok!');
                return;
            }

            UI.showLoading(submitBtn);
            UI.hideAlert(alertContainer);

            try {
                await Auth.register(username, email, password);

                UI.showAlert(alertContainer, 'success', 'Registrasi berhasil! Mengalihkan ke login...');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                UI.showAlert(alertContainer, 'danger', error.message || 'Registrasi gagal. Coba lagi.');
                UI.hideLoading(submitBtn);
            }
        });

        function togglePassword() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
        }
    </script>
</body>

</html>
