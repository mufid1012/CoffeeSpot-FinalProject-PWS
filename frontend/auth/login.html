<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login ke CoffeeSpot API Developer Dashboard">
    <title>Login - CoffeeSpot API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-hero);
            padding: var(--space-lg);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--space-lg);
            text-decoration: none;
        }

        .auth-title {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--space-xs);
        }

        .auth-subtitle {
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        .auth-footer {
            text-align: center;
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-footer p {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            margin: 0;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: var(--font-size-lg);
        }

        .alert-container {
            margin-bottom: var(--space-md);
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="../index.html" class="auth-logo">
                        <span>☕</span>
                        <span>CoffeeSpot</span>
                    </a>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Login untuk mengakses developer dashboard</p>
                </div>

                <div class="alert-container" id="alertContainer"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com"
                            required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">
                        Login
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Belum punya akun? <a href="register.html">Register sekarang</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Redirect if already authenticated
        Auth.redirectIfAuthenticated();

        const form = document.getElementById('loginForm');
        const alertContainer = document.getElementById('alertContainer');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            UI.showLoading(submitBtn);
            UI.hideAlert(alertContainer);

            try {
                const result = await Auth.login(email, password);

                UI.showAlert(alertContainer, 'success', 'Login berhasil! Mengalihkan...');

                setTimeout(() => {
                    const user = API.getUser();
                    if (user && user.role === 'admin') {
                        window.location.href = '../admin/dashboard.html';
                    } else {
                        window.location.href = '../user/dashboard.html';
                    }
                }, 1000);
            } catch (error) {
                UI.showAlert(alertContainer, 'danger', error.message || 'Login gagal. Periksa email dan password.');
                UI.hideLoading(submitBtn);
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
        }
    </script>
</body>

</html>
